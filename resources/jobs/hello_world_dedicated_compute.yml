resources:
  jobs:
    hello_world_dedicated_compute:
      name: Hello World Dedicated Compute Example
      max_concurrent_runs: 1
      job_clusters:
      - job_cluster_key: cluster
        new_cluster:
          spark_version: 15.4.x-scala2.12
          node_type_id: i3.xlarge
          num_workers: 1
      tasks:
      - task_key: hello_world
        job_cluster_key: cluster
        libraries:
        - whl: ${var.whl_path}
        notebook_task:
          notebook_path: ../../notebooks/hello_world.py
      queue:
        enabled: true
