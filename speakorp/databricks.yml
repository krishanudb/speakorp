bundle:
  name: speakorp

resources:
  apps:
    app:
      name: "speakorp"
      description: "Executive communication speaking-practice coach with AI feedback"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true

      # On-behalf-of-user scope so the app can query the model serving endpoint.
      user_api_scopes:
        - serving.serving-endpoints

      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-5
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://dbc-ccb985ab-2291.cloud.databricks.com
